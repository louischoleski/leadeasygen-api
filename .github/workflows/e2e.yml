name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the production migration check and apply be run on demand, without a
  # push and without repo-admin rights. Re-running someone else's run needs
  # admin; dispatching a workflow does not.
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Does anything waiting to be applied to PRODUCTION delete data? Additive
  # migrations are safe to apply from a pipeline; a DROP is not — the rows are
  # gone and no down-migration brings them back, so an empty table recreated by
  # a rollback is not a rollback. This fails the run, making the deletion a
  # decision someone makes rather than something a deploy did.
  #
  # Skips when DATABASE_URL is unset, so a fork is not red for missing a secret.
  # Any connection mode works: migrate:check only READS which migrations are
  # applied. The session/direct requirement belongs to whatever APPLIES them,
  # which is not this job.
  migration-safety:
    name: Migration safety (production)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # DATABASE_URL lives on the Production ENVIRONMENT, and an environment's
    # secrets are invisible to a job that does not declare it — the job sees
    # repo-level secrets only and the value resolves to empty. That is not an
    # error anywhere: it silently took the skip branch.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check for destructive pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — skipping the production check."
            exit 0
          fi
          npm run migrate:check

  # Applies what the check above cleared. Split from it deliberately: that job
  # decides, this one acts, and `needs` makes the decision a precondition —
  # a destructive migration exits the check non-zero and this never starts.
  #
  # This is the "one instance" argument for putting it in CI at all. The
  # alternative was migrating at boot, where every serverless cold start
  # re-runs them on the request path and concurrent instances race. One runner,
  # once per push. (The runner is safe under concurrency regardless —
  # pg_advisory_xact_lock plus an in-lock recheck — but a single applier means
  # never having to rely on that.)
  #
  # NOT a deploy gate. Vercel deploys on push independently, so new code can be
  # live for the ~minute this takes. Additive migrations make that survivable:
  # the new column simply is not there yet. It is the reason destructive ones
  # are refused rather than sequenced.
  migrate:
    name: Apply migrations (production)
    runs-on: ubuntu-latest
    needs: migration-safety
    if: github.ref == 'refs/heads/main'
    environment: Production
    # Two pushes in quick succession must not both apply. Queue rather than
    # cancel: a half-finished migration run is worse than a late one.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — nothing to migrate against."
            exit 0
          fi
          npm run migrate
      # Proves it, rather than trusting the exit code of the thing that just
      # ran. migrate:check exits non-zero only on destructive pending work, so
      # read the output: "up to date" is the claim being verified.
      - name: Confirm nothing is left pending
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then exit 0; fi
          npm run migrate:check

  api-e2e:
    name: API e2e (MFA)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadeasygen
          POSTGRES_PASSWORD: leadeasygen
          POSTGRES_DB: leadeasygen_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadeasygen -d leadeasygen_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://leadeasygen:leadeasygen@localhost:5432/leadeasygen_dev
      # 32+ chars so auth boots without the insecure-secret warning.
      JWT_SECRET: ci-e2e-jwt-secret-please-change-in-prod-0001
      # SMTP intentionally unset — the MFA spec reads pins from the DB, so email
      # delivery isn't needed and courier stays disabled.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # API tests use Playwright's request fixture only — no browser download.
      # Start the API ONLY (dev:api), not the scrape worker: these specs drive
      # task state directly via DB helpers (seedCompletedTask / ageTask) and
      # assert worker-independent outcomes. Running the live worker races the
      # tests — it picks up a just-created job and, with no scrape target in CI,
      # flips it to 'error', which the dedup/active-job queries exclude — so a
      # duplicate resubmit non-deterministically 201-creates instead of 409ing.
      # `dev:api` starts the server ONLY — unlike `dev`, which is
      # `migrate && concurrently`. Against a fresh CI database that means the
      # API boots with no schema and dies on the first query
      # (`relation "fonderie_plans" does not exist`), so the health check never
      # passes and every run fails before a single test executes. Migrate first.
      - name: Run migrations
        run: npm run migrate

      - name: Start API, wait for health, run e2e
        run: |
          npm run dev:api > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && break; sleep 2; done
          curl -sf http://localhost:3000/health || { echo "API failed to start"; cat api.log; exit 1; }
          npm run test:e2e

      - name: API log on failure
        if: failure()
        run: cat api.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
